    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(934.520391 722.972408)">Decision logs, call counts, time and memory</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52657c" x="1072.8" y="585.821406" transform="rotate(-0 1072.8 585.821406)">All evaluated candidates</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b45" x="43.2" y="730.464375" transform="rotate(-0 43.2 730.464375)">Loop until the evaluation / gradient budget is reached.</text>
   </g>
   <g id="text_31">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52657c" x="43.2" y="773.435313" transform="rotate(-0 43.2 773.435313)">Shared models, proposals and scoring across both arms. ipSAE is a confidence proxy, not an affinity measurement.</text>
   </g>
