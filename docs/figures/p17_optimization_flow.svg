   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b45" x="43.2" y="50.650313" transform="rotate(-0 43.2 50.650313)">P17 optimization</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52657c" x="43.2" y="90.539063" transform="rotate(-0 43.2 90.539063)">Model guidance proposes edits. Full-confidence scores decide which candidates stay.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2765a6" x="345.6" y="161.71125" transform="rotate(-0 345.6 161.71125)">1  SHARED GRADIENT GUIDANCE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2765a6" x="446.4" y="220.139063" transform="rotate(-0 446.4 220.139063)">OpenDDE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(375.458555 247.622279)">Full structure + confidence</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(380.292656 262.172408)">Contacts and pose RMSD</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2765a6" x="673.2" y="220.080469" transform="rotate(-0 673.2 220.080469)">AbLang2</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(622.810664 247.622279)">Antibody sequence</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(644.79668 262.172408)">plausibility</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2765a6" x="558" y="363.587188" transform="rotate(-0 558 363.587188)">Combine the current losses</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(430.842578 398.613816)">Contacts + RMSD + ipTM + PAE + pTMEnergy</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(430.35875 413.856809)">AbLang2 + edit penalty → sequence gradients</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52657c" x="558" y="460.679375" transform="rotate(-0 558 460.679375)">Model weights stay frozen</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b45" x="154.8" y="187.739063" transform="rotate(-0 154.8 187.739063)">Active parents</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(106.693047 228.99232)">Initialize from WT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(78.614688 244.235313)">Fixed target and framework</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(114.3475 259.478305)">CDR edits only</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2765a6" x="900" y="168.91125" transform="rotate(-0 900 168.91125)">2  PROPOSE A CANDIDATE</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(978.327578 218.19232)">Gradient-biased CDR edits</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(973.613906 233.435313)">Entropy-controlled sampling</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(923.234766 248.678305)">Revert / replace / exchange · hard WT edit cap</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #2765a6" transform="translate(856.8 327.239205)">Sequence</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #2765a6" transform="translate(856.8 340.403607)">gradient</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087d70" x="900" y="391.973281" transform="rotate(-0 900 391.973281)">3  FULL-CONFIDENCE EVALUATION</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087d70" x="1051.2" y="435.536406" transform="rotate(-0 1051.2 435.536406)">Full OpenDDE · frozen weights</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(935.569125 477.614278)">Diffusion + confidence head · forward only</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(926.278594 492.580125)">Directional-min ipSAE for each structural seed</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(935.483906 507.545972)">Selection score = mean across fixed seeds</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087d70" x="1072.8" y="330.359375" transform="rotate(-0 1072.8 330.359375)">Discrete sequence</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a96012" x="72" y="539.71125" transform="rotate(-0 72 539.71125)">4  COMPARE TWO RETENTION POLICIES</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a96012" x="72" y="583.187187" transform="rotate(-0 72 583.187187)">Independent searches</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(72 622.022279)">Offspring competes with its own parent</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(72 636.572408)">Separate trajectories; no parent exchange</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 12.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a96012" x="439.2" y="582.994031" transform="rotate(-0 439.2 582.994031)">Population with local competition</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(439.2 622.022279)">Offspring competes with a nearby sequence</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172b45" transform="translate(439.2 636.572408)">Retain alternatives and protect the best</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d70" x="820.8" y="495.821406" transform="rotate(-0 820.8 495.821406)">Score</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a96012" transform="translate(172.8 391.622279)">Retained candidates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a96012" transform="translate(172.8 406.172408)">become the next parents</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b45" x="1051.2" y="666.263125" transform="rotate(-0 1051.2 666.263125)">Evaluation archive</text>
   </g>
